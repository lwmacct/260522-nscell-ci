name: Test release
run-name: Release gate / ${{ inputs.vm_grouping }} / ${{ inputs.nscell_image }}

on:
  workflow_dispatch:
    inputs:
      nscell_image:
        description: Exact OCI image containing the NSCell binary
        required: true
        type: string
      vm_image_ref:
        description: Explicit standard VM image OCI reference
        required: true
        default: ghcr.io/lwmacct/260522-nscell-ci:artifact-images-standard
        type: string
      vm_suite:
        description: VM manifest suite
        required: true
        default: gate
        type: choice
        options:
          - smoke
          - gate
          - full
      vm_grouping:
        description: Bundle compatible targets in one VM or keep every target isolated
        required: true
        default: bundled
        type: choice
        options:
          - bundled
          - isolated

permissions:
  contents: read
  packages: read

concurrency:
  group: test-release-${{ github.ref }}-${{ inputs.nscell_image }}-${{ inputs.vm_suite }}-${{ inputs.vm_grouping }}
  cancel-in-progress: true

jobs:
  vm:
    name: VM ${{ inputs.vm_suite }}
    uses: ./.github/workflows/test-vm.yml
    with:
      image_name: standard
      image_ref: ${{ inputs.vm_image_ref }}
      nscell_image: ${{ inputs.nscell_image }}
      suite: ${{ inputs.vm_suite }}
      grouping: ${{ inputs.vm_grouping }}
    secrets: inherit

  vm-floor:
    name: VM Linux 6.18 floor
    uses: ./.github/workflows/test-vm.yml
    with:
      image_name: linux-6-18
      nscell_image: ${{ inputs.nscell_image }}
      suite: smoke
      targets: kernel-capability-smoke,fuse-copy-file-range,new-mount-api-deny
      grouping: ${{ inputs.vm_grouping }}
    secrets: inherit
