name: Test release
run-name: Release ${{ inputs.vm_suite }} / ${{ inputs.vm_targets || 'manifest' }} / ${{ inputs.vm_grouping }} / ${{ inputs.nscell_image }}

on:
  workflow_dispatch:
    inputs:
      nscell_image:
        description: Public NSCell image tag or digest; tags are resolved to an immutable digest
        required: true
        type: string
      vm_image_ref:
        description: Explicit standard VM image OCI reference
        required: true
        default: ghcr.io/lwmacct/260522-nscell-ci:artifact-images-standard
        type: string
      vm_suite:
        description: VM manifest suite
        required: true
        default: gate
        type: choice
        options:
          - smoke
          - gate
          - full
      vm_targets:
        description: Optional space-separated targets overriding the suite
        required: false
        default: ""
        type: string
      vm_grouping:
        description: Bundle compatible targets in one VM or keep every target isolated
        required: true
        default: bundled
        type: choice
        options:
          - bundled
          - isolated

permissions:
  contents: read
  packages: read

concurrency:
  group: test-release-${{ github.ref }}-${{ inputs.nscell_image }}-${{ inputs.vm_suite }}-${{ inputs.vm_targets || 'manifest' }}-${{ inputs.vm_grouping }}
  cancel-in-progress: true

jobs:
  vm:
    name: VM ${{ inputs.vm_suite }}
    uses: ./.github/workflows/test-vm.yml
    with:
      image_name: standard
      image_ref: ${{ inputs.vm_image_ref }}
      nscell_image: ${{ inputs.nscell_image }}
      suite: ${{ inputs.vm_suite }}
      targets: ${{ inputs.vm_targets }}
      grouping: ${{ inputs.vm_grouping }}
    secrets: inherit
