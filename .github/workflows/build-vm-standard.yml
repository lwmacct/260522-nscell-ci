name: Build VM images

on:
  push:
    branches:
      - main
    paths:
      - images/*.yaml
      - .github/workflows/build-vm-standard.yml
  workflow_dispatch:
    inputs:
      images:
        description: Space-separated image profiles, or all
        required: true
        default: standard
        type: string
      publish:
        description: Publish built images to GHCR
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: build-vm-images-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  OCI_REPOSITORY: ghcr.io/${{ github.repository }}
  DISTROBUILDER_VERSION: 3.3.1
  DISTROBUILDER_CACHE_VERSION: 1
  ORAS_VERSION: 1.3.3
  ARCHITECTURE: amd64
  VARIANT: default
  PYTHON_IMAGE: docker.io/library/python:3.14.4-alpine3.23

jobs:
  prepare:
    name: Prepare image matrix
    runs-on: ubuntu-26.04
    outputs:
      images: ${{ steps.matrix.outputs.images }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select image profiles
        id: matrix
        env:
          BEFORE_SHA: ${{ github.event.before || '' }}
          EVENT_NAME: ${{ github.event_name }}
          SELECTED_IMAGES: ${{ inputs.images || '' }}
        run: |
          __all_images() {
            find images -maxdepth 1 -type f -name '*.yaml' -printf '%f\n' |
              sed "s/\.yaml$//" |
              sort
          }

          __main() {
            local _before_sha _image _images_json _raw
            local -a _images=()

            if [[ "${EVENT_NAME}" == workflow_dispatch ]]; then
              _raw="${SELECTED_IMAGES//,/ }"
              if [[ "${_raw}" == all ]]; then
                mapfile -t _images < <(__all_images)
              else
                read -r -a _images <<<"${_raw}"
              fi
            else
              _before_sha="${BEFORE_SHA}"
              if [[ -z "${_before_sha}" || "${_before_sha}" =~ ^0+$ ]] ||
                ! git cat-file -e "${_before_sha}^{commit}" 2>/dev/null; then
                mapfile -t _images < <(__all_images)
              elif git diff --name-only "${_before_sha}" "${GITHUB_SHA}" -- \
                .github/workflows/build-vm-standard.yml |
                grep -qx '.github/workflows/build-vm-standard.yml'; then
                mapfile -t _images < <(__all_images)
              else
                mapfile -t _images < <(
                  git diff --name-only "${_before_sha}" "${GITHUB_SHA}" -- 'images/*.yaml' |
                    while IFS= read -r _image; do
                      [[ -f "${_image}" ]] || continue
                      basename "${_image}" .yaml
                    done |
                    sort -u
                )
              fi
            fi

            if ((${#_images[@]} == 0)); then
              echo "no image profiles selected" >&2
              return 2
            fi

            mapfile -t _images < <(printf '%s\n' "${_images[@]}" | sort -u)
            for _image in "${_images[@]}"; do
              if [[ ! "${_image}" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
                echo "invalid image profile: ${_image}" >&2
                return 2
              fi
              if [[ ! -f "images/${_image}.yaml" ]]; then
                echo "unknown image profile: ${_image}" >&2
                return 2
              fi
            done

            _images_json="$(printf '%s\n' "${_images[@]}" | jq -R . | jq -sc .)"
            echo "images=${_images_json}" >> "${GITHUB_OUTPUT}"
            {
              echo "## Selected image profiles"
              echo
              printf -- "- \`%s\`\n" "${_images[@]}"
            } >> "${GITHUB_STEP_SUMMARY}"
          }

          __main "$@"

  build:
    name: ${{ matrix.image }} / VM / AMD64
    needs: prepare
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.prepare.outputs.images) }}
    env:
      IMAGE_NAME: ${{ matrix.image }}
      IMAGE_DEFINITION: images/${{ matrix.image }}.yaml
      OUTPUT_DIR_NAME: artifact-images-${{ matrix.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version: "1.25.6"

      - name: Cache distrobuilder ${{ env.DISTROBUILDER_VERSION }}
        uses: actions/cache@v4.2.4
        with:
          path: ${{ runner.temp }}/distrobuilder-cache
          key: distrobuilder-${{ runner.os }}-amd64-${{ env.DISTROBUILDER_VERSION }}-go1.25.6-v${{ env.DISTROBUILDER_CACHE_VERSION }}

      - name: Install Incus from Zabbly and build dependencies
        run: |
          __main() {
            local _architecture _codename

            set -euo pipefail
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends \
              btrfs-progs \
              build-essential \
              ca-certificates \
              curl \
              debootstrap \
              dnsmasq-base \
              dosfstools \
              gdisk \
              gpg \
              gpg-agent \
              jq \
              ovmf \
              qemu-system-modules-spice \
              qemu-system-x86 \
              qemu-utils \
              rsync \
              squashfs-tools \
              xz-utils \
              zstd
            sudo install -d -m 0755 /etc/apt/keyrings
            sudo curl -fsSL https://pkgs.zabbly.com/key.asc \
              -o /etc/apt/keyrings/zabbly.asc
            _codename="$(. /etc/os-release && echo "${VERSION_CODENAME}")"
            _architecture="$(dpkg --print-architecture)"
            sudo tee /etc/apt/sources.list.d/zabbly-incus-stable.sources >/dev/null <<EOF
          Enabled: yes
          Types: deb
          URIs: https://pkgs.zabbly.com/incus/stable
          Suites: ${_codename}
          Components: main
          Architectures: ${_architecture}
          Signed-By: /etc/apt/keyrings/zabbly.asc
          EOF
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends incus
            apt-cache policy incus
            apt-cache policy incus | grep -F \
              'https://pkgs.zabbly.com/incus/stable' >/dev/null
          }

          __main "$@"

      - name: Build and install distrobuilder ${{ env.DISTROBUILDER_VERSION }}
        env:
          GOFLAGS: >-
            -tags=containers_image_storage_stub,containers_image_docker_daemon_stub,containers_image_openpgp
        run: |
          __main() {
            set -euo pipefail

            mkdir -p "${RUNNER_TEMP}/distrobuilder-cache"
            if [[ ! -x "${RUNNER_TEMP}/distrobuilder-cache/distrobuilder" ]]; then
              GOBIN="${RUNNER_TEMP}/distrobuilder-cache" \
                go install "github.com/lxc/distrobuilder/v3/distrobuilder@v${DISTROBUILDER_VERSION}"
            fi
            sudo install -m 0755 \
              "${RUNNER_TEMP}/distrobuilder-cache/distrobuilder" \
              /usr/local/bin/distrobuilder
            distrobuilder --version
          }

          __main "$@"

      - name: Setup ORAS ${{ env.ORAS_VERSION }}
        uses: oras-project/setup-oras@v2.0.1
        with:
          version: ${{ env.ORAS_VERSION }}

      - name: Login to GHCR
        uses: docker/login-action@v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate image definition
        run: |
          __main() {
            set -euo pipefail
            sudo distrobuilder validate "${IMAGE_DEFINITION}"
          }

          __main "$@"

      - name: Build Incus VM image
        run: |
          __main() {
            local _description _release _serial

            set -euo pipefail
            _serial="$(date -u +%Y%m%d_%H%M)"
            echo "SERIAL=${_serial}" >> "${GITHUB_ENV}"
            sudo install -d -m 0755 "${RUNNER_TEMP}/${OUTPUT_DIR_NAME}"
            case "${IMAGE_NAME}" in
              standard)
                _release="resolute"
                _description="Test VM ${IMAGE_NAME}: Ubuntu 26.04 AMD64"
                ;;
              *)
                echo "unsupported image profile: ${IMAGE_NAME}" >&2
                return 2
                ;;
            esac
            sudo distrobuilder build-incus \
              "${IMAGE_DEFINITION}" \
              "${RUNNER_TEMP}/${OUTPUT_DIR_NAME}" \
              --type=split \
              --compression=xz \
              --vm \
              --timeout=5400 \
              -o image.architecture="${ARCHITECTURE}" \
              -o image.release="${_release}" \
              -o image.variant="${VARIANT}" \
              -o image.description="${_description}" \
              -o image.serial="${_serial}"
            sudo chown -R "$(id -u):$(id -g)" \
              "${RUNNER_TEMP}/${OUTPUT_DIR_NAME}"
          }

          __main "$@"

      - name: Setup Incus for Python image cache
        if: matrix.image == 'standard'
        id: incus
        uses: ./.github/actions/incus-vm-setup

      - name: Warm Python image cache
        if: matrix.image == 'standard'
        env:
          VM_CPU: ${{ steps.incus.outputs.vm_cpu_count }}
          VM_MEMORY: ${{ steps.incus.outputs.vm_memory_limit }}
        run: |
          __wait_for_guest() {
            local _attempt

            for _attempt in $(seq 1 60); do
              if sudo incus exec "${_vm_name}" -- sh -c \
                'docker info >/dev/null 2>&1 && test -f /etc/test-vm-profile' >/dev/null 2>&1; then
                return 0
              fi
              sleep 5
            done

            echo "Python cache warming VM did not become ready" >&2
            return 1
          }

          __cleanup() {
            sudo incus delete --force "${_vm_name}" >/dev/null 2>&1 || true
            sudo incus image delete "${_base_alias}" >/dev/null 2>&1 || true
            sudo incus image delete "${_warmed_alias}" >/dev/null 2>&1 || true
          }

          __main() {
            local _artifact_dir _base_disk_size _disk _disk_size _export_dir

            set -euo pipefail
            _artifact_dir="${RUNNER_TEMP}/${OUTPUT_DIR_NAME}"
            _export_dir="${RUNNER_TEMP}/${OUTPUT_DIR_NAME}-warmed"
            _resource_id="warm-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}"
            _vm_name="nscell-image-${_resource_id}"
            _base_alias="nscell-image-base-${_resource_id}"
            _warmed_alias="nscell-image-warmed-${_resource_id}"
            trap __cleanup EXIT

            mkdir -p "${_export_dir}"
            sudo incus image import \
              "${_artifact_dir}/incus.tar.xz" \
              "${_artifact_dir}/disk.qcow2" \
              --alias "${_base_alias}"
            sudo incus init "${_base_alias}" "${_vm_name}" \
              --vm \
              -c security.secureboot=false \
              -c limits.cpu="${VM_CPU}" \
              -c limits.memory="${VM_MEMORY}"
            sudo incus start "${_vm_name}"
            __wait_for_guest

            sudo incus exec "${_vm_name}" -- \
              docker pull --platform linux/amd64 "${PYTHON_IMAGE}"
            sudo incus exec "${_vm_name}" -- \
              docker image inspect "${PYTHON_IMAGE}" --format '{{.Id}}'
            sudo incus exec "${_vm_name}" -- sh -c '
              : >/etc/machine-id
              rm -f /var/lib/dbus/machine-id /var/lib/systemd/random-seed
              find /var/log -type f -exec truncate -s 0 {} +
            '
            sudo incus stop "${_vm_name}"

            sudo incus publish "${_vm_name}" \
              --format split \
              --compression xz \
              --alias "${_warmed_alias}" \
              --reuse
            sudo incus image export "${_warmed_alias}" "${_export_dir}" --vm
            sudo chown -R "$(id -u):$(id -g)" "${_export_dir}"

            _disk="$(find "${_export_dir}" -maxdepth 1 -type f -name '*.qcow2' -print -quit)"
            [[ -n "${_disk}" ]]
            _base_disk_size="$(stat -c '%s' "${_artifact_dir}/disk.qcow2")"
            mv "${_artifact_dir}/disk.qcow2" "${_artifact_dir}/disk.qcow2.distrobuilder"
            mv "${_disk}" "${_artifact_dir}/disk.qcow2"
            _disk_size="$(stat -c '%s' "${_artifact_dir}/disk.qcow2")"
            {
              echo "## Warmed Python image cache"
              echo
              echo "- Image: \`${PYTHON_IMAGE}\`"
              echo "- Base disk size: \`${_base_disk_size}\` bytes"
              echo "- Warmed disk size: \`${_disk_size}\` bytes"
            } >> "${GITHUB_STEP_SUMMARY}"
          }

          __main "$@"

      - name: Check VM artifact files
        run: |
          __main() {
            set -euo pipefail
            test -s "${RUNNER_TEMP}/${OUTPUT_DIR_NAME}/incus.tar.xz"
            test -s "${RUNNER_TEMP}/${OUTPUT_DIR_NAME}/disk.qcow2"
            stat -c '%n %s bytes' \
              "${RUNNER_TEMP}/${OUTPUT_DIR_NAME}/incus.tar.xz" \
              "${RUNNER_TEMP}/${OUTPUT_DIR_NAME}/disk.qcow2"
            qemu-img info --output=json \
              "${RUNNER_TEMP}/${OUTPUT_DIR_NAME}/disk.qcow2" |
              jq '{filename,format,virtual_size:.["virtual-size"],actual_size:.["actual-size"]}'
            qemu-img check "${RUNNER_TEMP}/${OUTPUT_DIR_NAME}/disk.qcow2"
          }

          __main "$@"

      - name: Write checksums
        run: |
          __main() {
            set -euo pipefail
            (
              cd "${RUNNER_TEMP}/${OUTPUT_DIR_NAME}"
              sha256sum incus.tar.xz disk.qcow2 > SHA256SUMS
            )
          }

          __main "$@"

      - name: Publish candidate to GHCR
        if: ${{ inputs.publish || github.event_name == 'push' }}
        env:
          ORAS_ARTIFACT_TYPE_VM: application/vnd.linuxcontainers.incus.virtual-machine-image.v1
          ORAS_METADATA_TYPE: application/vnd.linuxcontainers.incus.metadata.v1+tar+xz
          ORAS_DISK_TYPE: application/vnd.linuxcontainers.incus.disk.v1+qcow2
          ORAS_CHECKSUM_TYPE: text/plain
        run: |
          __main() {
            local _description _digest _full_sha _revision_tag _short_sha _stable_tag

            set -euo pipefail
            case "${IMAGE_NAME}" in
              standard)
                _description="Test VM ${IMAGE_NAME}: Ubuntu 26.04 AMD64"
                ;;
              *)
                echo "unsupported image profile: ${IMAGE_NAME}" >&2
                return 2
                ;;
            esac
            _full_sha="$(git rev-parse HEAD)"
            _short_sha="${_full_sha:0:12}"
            _revision_tag="artifact-images-${IMAGE_NAME}-sha-${_short_sha}"
            _stable_tag="artifact-images-${IMAGE_NAME}"
            (
              cd "${RUNNER_TEMP}/${OUTPUT_DIR_NAME}"
              oras push --no-tty \
                --artifact-type "${ORAS_ARTIFACT_TYPE_VM}" \
                --annotation "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
                --annotation "org.opencontainers.image.revision=${_full_sha}" \
                --annotation "org.opencontainers.image.version=${SERIAL}" \
                --annotation "org.opencontainers.image.description=${_description}" \
                --annotation "io.github.lwmacct.image.profile=${IMAGE_NAME}" \
                "${OCI_REPOSITORY}:${_revision_tag}" \
                "incus.tar.xz:${ORAS_METADATA_TYPE}" \
                "disk.qcow2:${ORAS_DISK_TYPE}" \
                "SHA256SUMS:${ORAS_CHECKSUM_TYPE}"
            )
            oras tag "${OCI_REPOSITORY}:${_revision_tag}" "${_stable_tag}"
            _digest="$(oras resolve "${OCI_REPOSITORY}:${_revision_tag}")"
            [[ "${_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
            {
              echo "## Published test VM candidate"
              echo
              echo "- Profile: \`${IMAGE_NAME}\`"
              echo "- Candidate: \`${OCI_REPOSITORY}:${_revision_tag}\`"
              echo "- Stable: \`${OCI_REPOSITORY}:${_stable_tag}\`"
              echo "- Immutable: \`${OCI_REPOSITORY}@${_digest}\`"
            } >> "${GITHUB_STEP_SUMMARY}"
          }

          __main "$@"
