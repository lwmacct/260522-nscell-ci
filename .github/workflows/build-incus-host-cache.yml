name: Build Incus host cache

on:
  workflow_call:
  push:
    branches:
      - main
    paths:
      - .github/actions/incus-vm-setup/action.yml
      - .github/incus-host/**
      - .github/scripts/incus-host-cache.sh
      - .github/workflows/build-incus-host-cache.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-incus-host-cache
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build host layer
    runs-on: ubuntu-26.04
    outputs:
      cache_key: ${{ steps.key.outputs.cache_key }}
      cache_hit: ${{ steps.cache.outputs.cache-hit }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Compute exact host cache key
        id: key
        run: |
          __main() {
            set -euo pipefail
            mkdir -p "${RUNNER_TEMP}/incus-host-cache"
            bash .github/scripts/incus-host-cache.sh key "${GITHUB_OUTPUT}"
            cp "${GITHUB_OUTPUT}" "${RUNNER_TEMP}/incus-host-cache/key.env"
          }

          __main "$@"

      - name: Require hosted image identity
        if: steps.key.outputs.cache_enabled != 'true'
        run: |
          echo "The runner did not expose a stable image version; refusing to publish a host layer." >&2
          exit 1

      - name: Restore existing host layer
        id: cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ runner.temp }}/incus-host-cache
          key: ${{ steps.key.outputs.cache_key }}

      - name: Capture standard runner baseline
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          __main() {
            set -euo pipefail
            bash .github/scripts/incus-host-cache.sh snapshot \
              "${RUNNER_TEMP}/incus-host-cache.snar"
          }

          __main "$@"

      - name: Install Incus host packages
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          __main() {
            set -euo pipefail
            bash .github/scripts/incus-host-cache.sh install
          }

          __main "$@"

      - name: Create host filesystem delta
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          __main() {
            set -euo pipefail
            bash .github/scripts/incus-host-cache.sh build-delta \
              "${RUNNER_TEMP}/incus-host-cache.snar" \
              "${RUNNER_TEMP}/incus-host-cache" \
              "${RUNNER_TEMP}/incus-host-cache/key.env"
          }

          __main "$@"

      - name: Upload host layer for fresh-runner verification
        uses: actions/upload-artifact@v7.0.1
        with:
          name: incus-host-cache-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/incus-host-cache
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Summarize host layer
        run: |
          __main() {
            local _size

            set -euo pipefail
            _size="$(du -h "${RUNNER_TEMP}/incus-host-cache/layer.tar" |
              awk '{print $1}')"
            {
              echo "## Incus host cache"
              echo
              echo "- Key: ${{ steps.key.outputs.cache_key }}"
              echo "- Layer size: ${_size}"
              echo "- Cache hit during build: ${{ steps.cache.outputs.cache-hit }}"
            } >> "${GITHUB_STEP_SUMMARY}"
          }

          __main "$@"

  verify:
    name: Verify host layer on fresh runner
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Compute exact host cache key
        id: key
        run: |
          __main() {
            set -euo pipefail
            mkdir -p "${RUNNER_TEMP}/incus-host-cache"
            bash .github/scripts/incus-host-cache.sh key "${GITHUB_OUTPUT}"
          }

          __main "$@"

      - name: Require identical fresh runner
        env:
          BUILD_CACHE_KEY: ${{ needs.build.outputs.cache_key }}
          VERIFY_CACHE_ENABLED: ${{ steps.key.outputs.cache_enabled }}
          VERIFY_CACHE_KEY: ${{ steps.key.outputs.cache_key }}
        run: |
          __main() {
            set -euo pipefail
            [[ "${VERIFY_CACHE_ENABLED}" == true ]]
            if [[ "${VERIFY_CACHE_KEY}" != "${BUILD_CACHE_KEY}" ]]; then
              echo "Fresh runner cache key differs from build runner." >&2
              echo "Build:  ${BUILD_CACHE_KEY}" >&2
              echo "Verify: ${VERIFY_CACHE_KEY}" >&2
              return 1
            fi
          }

          __main "$@"

      - name: Download host layer
        uses: actions/download-artifact@v8.0.1
        with:
          name: incus-host-cache-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/incus-host-cache

      - name: Apply host layer
        run: |
          __main() {
            set -euo pipefail
            bash .github/scripts/incus-host-cache.sh restore \
              "${RUNNER_TEMP}/incus-host-cache"
          }

          __main "$@"

      - name: Initialize Incus bridge
        run: |
          __main() {
            set -euo pipefail
            bash .github/scripts/incus-host-cache.sh initialize
          }

          __main "$@"

      - name: Verify Incus host runtime
        run: |
          __main() {
            set -euo pipefail
            bash .github/scripts/incus-host-cache.sh verify
          }

          __main "$@"

      - name: Publish verified host layer
        if: needs.build.outputs.cache_hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ runner.temp }}/incus-host-cache
          key: ${{ needs.build.outputs.cache_key }}

      - name: Summarize verification
        env:
          BUILD_CACHE_HIT: ${{ needs.build.outputs.cache_hit }}
          CACHE_KEY: ${{ needs.build.outputs.cache_key }}
        run: |
          __main() {
            local _size

            set -euo pipefail
            _size="$(du -h "${RUNNER_TEMP}/incus-host-cache/layer.tar" |
              awk '{print $1}')"
            {
              echo "## Verified Incus host cache"
              echo
              echo "- Key: \`${CACHE_KEY}\`"
              echo "- Layer size: \`${_size}\`"
              echo "- Existing cache hit: \`${BUILD_CACHE_HIT}\`"
              echo "- Fresh-runner restore: \`passed\`"
            } >> "${GITHUB_STEP_SUMMARY}"
          }

          __main "$@"
