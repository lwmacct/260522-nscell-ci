name: Test workloads in VM
run-name: VM ${{ inputs.suite }} / ${{ inputs.grouping }} / ${{ inputs.image_name }} / ${{ inputs.nscell_image }}

on:
  workflow_call:
    inputs:
      image_name:
        description: VM image profile name
        required: false
        default: standard
        type: string
      image_ref:
        description: Explicit VM image OCI reference; empty uses the stable profile tag
        required: false
        default: ""
        type: string
      nscell_image:
        description: Public NSCell image tag or digest; tags are resolved to an immutable digest
        required: true
        type: string
      suite:
        description: Manifest suite to run
        required: false
        default: gate
        type: string
      targets:
        description: Optional space-separated targets overriding the suite
        required: false
        default: ""
        type: string
      grouping:
        description: Keep targets isolated or bundle compatible suite targets in one VM
        required: false
        default: isolated
        type: string
  workflow_dispatch:
    inputs:
      image_name:
        description: VM image profile name
        required: true
        default: standard
        type: string
      image_ref:
        description: Explicit VM image OCI reference; empty uses the stable profile tag
        required: false
        default: ""
        type: string
      nscell_image:
        description: Public NSCell image tag or digest; tags are resolved to an immutable digest
        required: true
        type: string
      suite:
        description: Manifest suite to run
        required: true
        default: gate
        type: choice
        options:
          - smoke
          - gate
          - full
      targets:
        description: Optional space-separated targets overriding the suite
        required: false
        default: ""
        type: string
      grouping:
        description: Keep targets isolated or bundle compatible targets in one VM
        required: false
        default: isolated
        type: choice
        options:
          - isolated
          - bundled

permissions:
  contents: read
  packages: read

concurrency:
  group: test-vm-${{ github.ref }}-${{ inputs.image_name }}-${{ inputs.nscell_image }}-${{ inputs.suite }}-${{ inputs.targets || 'manifest' }}-${{ inputs.grouping }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI_REPOSITORY: lwmacct/260522-nscell-ci
  NSCELL_ARTIFACT_REPOSITORY: ghcr.io/lwmacct/260522-nscell
  VM_ARTIFACT_REPOSITORY: ghcr.io/lwmacct/260522-nscell-ci

jobs:
  prepare:
    name: Prepare workload matrix
    runs-on: ubuntu-26.04
    outputs:
      image_ref: ${{ steps.matrix.outputs.image_ref }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      nscell_image_ref: ${{ steps.matrix.outputs.nscell_image_ref }}
    steps:
      - name: Checkout CI repository
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ env.CI_REPOSITORY }}
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup ORAS
        uses: oras-project/setup-oras@v2.0.1
        with:
          version: 1.3.3

      - name: Login to GHCR
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image and workload selection
        id: matrix
        env:
          IMAGE_NAME: ${{ inputs.image_name || 'standard' }}
          IMAGE_REF: ${{ inputs.image_ref || '' }}
          NSCELL_IMAGE_INPUT: ${{ inputs.nscell_image }}
          TEST_SUITE: ${{ inputs.suite }}
          SELECTED_TARGETS: ${{ inputs.targets }}
          TEST_GROUPING: ${{ inputs.grouping }}
        run: |
          __main() {
            local _image_ref _matrix _nscell_image_ref _requested_image_ref
            local _requested_nscell_image

            if [[ ! "${IMAGE_NAME}" =~ ^[a-z0-9][a-z0-9-]*$ ]] ||
              [[ ! -f "images/${IMAGE_NAME}.yaml" ]]; then
              echo "unknown image profile: ${IMAGE_NAME}" >&2
              return 2
            fi
            _requested_nscell_image="${NSCELL_IMAGE_INPUT}"
            if [[ ! "${_requested_nscell_image}" =~ ^${NSCELL_ARTIFACT_REPOSITORY}(:[A-Za-z0-9_][A-Za-z0-9._-]*|@sha256:[0-9a-f]{64})$ ]]; then
              echo "unexpected NSCell image reference: ${_requested_nscell_image}" >&2
              return 2
            fi
            # Resolve once so the run can name the image it validated and a bad
            # reference fails before any VM boots.
            _nscell_image_ref="$(oras resolve --full-reference "${_requested_nscell_image}")"
            if [[ ! "${_nscell_image_ref}" =~ ^${NSCELL_ARTIFACT_REPOSITORY}@sha256:[0-9a-f]{64}$ ]]; then
              echo "unexpected resolved NSCell image reference: ${_nscell_image_ref}" >&2
              return 1
            fi
            _requested_image_ref="${IMAGE_REF}"
            if [[ -z "${_requested_image_ref}" ]]; then
              _requested_image_ref="${VM_ARTIFACT_REPOSITORY}:artifact-images-${IMAGE_NAME}"
            fi
            _image_ref="$(oras resolve --full-reference "${_requested_image_ref}")"
            if [[ ! "${_image_ref}" =~ ^${VM_ARTIFACT_REPOSITORY}@sha256:[0-9a-f]{64}$ ]]; then
              echo "unexpected resolved VM image reference: ${_image_ref}" >&2
              return 1
            fi
            _matrix="$(
              bash tests/manifest.sh select vm "${TEST_SUITE}" "${SELECTED_TARGETS}" "${TEST_GROUPING}"
            )"
            {
              echo "image_ref=${_image_ref}"
              echo "matrix=${_matrix}"
              echo "nscell_image_ref=${_nscell_image_ref}"
            } >> "${GITHUB_OUTPUT}"
            {
              echo "## VM test matrix"
              echo
              echo "- Suite: \`${TEST_SUITE}\`"
              echo "- Image profile: \`${IMAGE_NAME}\`"
              echo "- Requested image: \`${_requested_image_ref}\`"
              echo "- Resolved image: \`${_image_ref}\`"
              echo "- Requested NSCell image: \`${_requested_nscell_image}\`"
              echo "- Resolved NSCell image: \`${_nscell_image_ref}\`"
              echo "- Grouping: \`${TEST_GROUPING}\`"
              jq -r '.[] |
                "- Group: `\(.name)` (timeout: \(.timeout_minutes)m, targets: \(.targets | join(", ")))"
              ' <<<"${_matrix}"
            } >> "${GITHUB_STEP_SUMMARY}"
          }

          __main "$@"

  test:
    name: ${{ inputs.image_name || 'standard' }} VM / ${{ matrix.label }}
    needs: prepare
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      max-parallel: 40
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout CI repository
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ env.CI_REPOSITORY }}
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Incus host
        id: incus
        uses: ./.github/actions/incus-vm-setup

      - name: Pull and verify VM image
        id: image
        uses: ./.github/actions/pull-vm-image
        with:
          image_ref: ${{ needs.prepare.outputs.image_ref }}
          output_dir_name: artifact-${{ inputs.image_name || 'standard' }}-${{ matrix.name }}
          registry_username: ${{ github.actor }}
          registry_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare VM source share
        id: share
        uses: ./.github/actions/prepare-vm-share
        with:
          ci_repo: ${{ github.workspace }}
          test_target: ${{ matrix.name }}

      - name: Start isolated VM
        id: vm
        uses: ./.github/actions/incus-vm-start
        with:
          image_dir: ${{ steps.image.outputs.image_dir }}
          share_dir: ${{ steps.share.outputs.share_dir }}
          test_target: ${{ matrix.name }}
          vm_cpu: ${{ steps.incus.outputs.vm_cpu_count }}
          vm_memory: ${{ steps.incus.outputs.vm_memory_limit }}

      - name: Run workload in isolated VM
        uses: ./.github/actions/run-vm-workload
        with:
          vm_name: ${{ steps.vm.outputs.vm_name }}
          test_target: ${{ matrix.name }}
          test_targets_json: ${{ toJSON(matrix.targets) }}
          nscell_image: ${{ needs.prepare.outputs.nscell_image_ref }}

      - name: Cleanup isolated VM
        if: always()
        uses: ./.github/actions/incus-vm-cleanup
        with:
          test_target: ${{ matrix.name }}
          log_dir: ${{ runner.temp }}/test-vm-${{ matrix.name }}-logs

      - name: Upload VM diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-vm-${{ inputs.image_name || 'standard' }}-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-vm-${{ matrix.name }}-logs/**
          if-no-files-found: ignore
